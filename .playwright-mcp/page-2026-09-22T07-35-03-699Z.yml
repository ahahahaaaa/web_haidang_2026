              - heading [level=3] [ref=f5e281]:
                - strong [ref=f5e282]: Câu hỏi thường gặp về tour Ân Thi – Trương Gia Giới – Phượng Hoàng
              - paragraph [ref=f5e283]:
                - strong [ref=f5e284]: 1. Tour có khởi hành thường xuyên không?
              - paragraph [ref=f5e285]: Có. Haidangtravel có lịch khởi hành ghép đoàn hàng tuần. Khách lẻ hoặc nhóm 2-3 người vẫn có thể đăng ký.
              - paragraph [ref=f5e286]:
                - strong [ref=f5e287]: 2. Tôi có thể đặt tour cho gia đình có người lớn tuổi không?
              - paragraph [ref=f5e288]: Rất phù hợp. Tour có cáp treo, thang máy và xe đưa đón, hạn chế leo bộ không cần thiết. Hướng dẫn viên Haidangtravel có kinh nghiệm chăm sóc khách lớn tuổi (đi chậm, chú ý sức khỏe).
              - paragraph [ref=f5e289]:
