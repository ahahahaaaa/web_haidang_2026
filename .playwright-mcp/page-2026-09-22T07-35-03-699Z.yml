        - generic [ref=f5e181]:
          - heading "GIỚI THIỆU TOUR" [level=2] [ref=f5e184]
          - generic [ref=f5e186]:
            - generic [ref=f5e189]:
              - heading [level=2] [ref=f5e190]:
                - strong [ref=f5e191]: "Tour Ân Thi – Trương Gia Giới – Phượng Hoàng Cổ Trấn: Kỳ quan karst, thung lũng phim Avatar và cổ trấn nghìn năm"
              - paragraph [ref=f5e192]: "Haidangtravel tự hào giới thiệu tour Ân Thi – Trương Gia Giới – Phượng Hoàng Cổ Trấn 5 ngày 4 đêm – hành trình nối ba vùng đất biểu tượng của Trung Quốc: từ Đại Hiệp Cốc Ân Thi được mệnh danh \"Thụy Sĩ phương Đông\", đến những cột đá kỳ vĩ của Trương Gia Giới – bối cảnh chính của phim Avatar, và kết thúc bằng không gian cổ kính bên sông Đà của Phượng Hoàng Cổ Trấn. Không chỉ ngắm cảnh, tour còn đưa bạn trải nghiệm kiến trúc Thổ Ty Thành, thưởng thức lễ hội đa dân tộc và khám phá những công trình kỷ lục thế giới như cáp treo dài nhất hành tinh. Mọi thủ tục visa, di chuyển, lưu trú đều đã được chúng tôi lo trọn gói."
              - heading "Tại sao nên chọn tour này qua Haidangtravel?" [level=3] [ref=f5e193]
              - paragraph [ref=f5e194]:
                - strong [ref=f5e195]: "Kết hợp hoàn hảo ba miền di sản:"
                - text: Một hành trình duy nhất đưa bạn đến cảnh quan karst hùng vĩ của Ân Thi, kỳ quan cột đá của Trương Gia Giới và nét cổ kính của Phượng Hoàng – trải nghiệm đa dạng hiếm có.
              - paragraph [ref=f5e196]:
                - strong [ref=f5e197]: "Khám phá văn hóa Thổ Gia độc đáo:"
                - text: Điểm đặc biệt của tour so với các tour Trung Quốc thông thường là bạn được tìm hiểu về văn hóa dân tộc Thổ Gia – dân tộc thiểu số lớn nhất Trung Quốc với lối sống mẫu hệ độc đáo, thông qua các điểm đến như Nữ Nhi Thành và Thổ Ty Thành.
              - paragraph [ref=f5e198]:
                - strong [ref=f5e199]: "Hỗ trợ visa trọn gói:"
                - text: Chúng tôi lo toàn bộ thủ tục visa Trung Quốc, bạn chỉ cần cung cấp hộ chiếu và ảnh.
              - paragraph [ref=f5e200]:
                - strong [ref=f5e201]: "Hướng dẫn viên tiếng Việt tại chỗ:"
                - text: Am hiểu từng địa danh, biết cách săn thời điểm chụp ảnh đẹp và chăm sóc khách Việt chu đáo.
              - paragraph [ref=f5e202]:
                - strong [ref=f5e203]: "Không phát sinh chi phí:"
                - text: Mọi khoản đã được báo trước trong hợp đồng, không phát sinh thêm.
              - paragraph [ref=f5e204]:
                - strong [ref=f5e205]: "Lịch trình khoa học:"
                - text: Sắp xếp thời gian hợp lý, không chạy show, có thời gian nghỉ ngơi và chụp ảnh thoải mái.
              - heading "Tour Ân Thi – Trương Gia Giới – Phượng Hoàng đi những đâu?" [level=3] [ref=f5e206]
              - paragraph [ref=f5e207]:
                - strong [ref=f5e208]: Ân Thi (Enshi) – "Thụy Sĩ phương Đông" giữa lòng Hồ Bắc
              - paragraph [ref=f5e209]: Ân Thi là một châu tự trị thuộc tỉnh Hồ Bắc, nơi sinh sống của 45 dân tộc, trong đó người Thổ Gia, Miêu và Đồng chiếm đa số. Được mệnh danh là "Thụy Sĩ phương Đông", nơi đây sở hữu địa hình núi non hiểm trở, những hẻm núi karst kỳ vĩ và dòng sông pha lê trong vắt.
              - heading [level=3] [ref=f5e210]:
                - strong [ref=f5e211]: "Điểm đến nổi bật tại Ân Thi trong tour:"
              - list [ref=f5e212]:
                - listitem [ref=f5e213]:
                  - strong [ref=f5e214]: "Đại Hiệp Cốc Ân Thi (Enshi Grand Canyon):"
                  - text: Trái tim của cảnh quan karst, nơi những vách đá dựng đứng và sông ngầm tạo nên bức tranh thiên nhiên hùng vĩ.
                - listitem [ref=f5e215]: "Nữ Nhi Thành (Daughter City): Tái hiện sinh động chế độ mẫu hệ độc đáo của người Thổ Gia – nơi phụ nữ nắm quyền trong gia đình và xã hội."
                - listitem [ref=f5e216]:
                  - strong [ref=f5e217]: "Thổ Ty Thành (Enshi Tusi Castle):"
                  - text: Biểu tượng văn hóa Thổ Gia với lịch sử hơn 450 năm.
                - listitem [ref=f5e218]:
                  - strong [ref=f5e219]: "Long Lân Cung:"
                  - text: Hang động được hình thành bởi hàng triệu năm kiến tạo, nổi bật với hệ thống nhũ đá kỳ ảo.
              - heading [level=3] [ref=f5e220]:
                - strong [ref=f5e221]: Trương Gia Giới (Zhangjiajie) – Thung lũng phim Avatar
              - paragraph [ref=f5e222]: "Công viên rừng quốc gia đầu tiên của Trung Quốc, nơi có hơn 3.000 cột đá sa thạch được UNESCO công nhận là Di sản thế giới. Đây cũng là bối cảnh chính truyền cảm hứng cho những ngọn núi lơ lửng trong bom tấn Avatar. Các điểm tham quan chính bao gồm: cáp treo Thiên Môn Sơn dài 7,45km (dài nhất thế giới), hang Thiên Môn (cao 131,5m – hang tự nhiên cho máy bay bay qua), đường 99 khúc cua ngoạn mục, và cầu kính Đại Hiệp Cốc dài 430m treo trên vực sâu."
              - heading [level=3] [ref=f5e223]:
                - strong [ref=f5e224]: Phượng Hoàng Cổ Trấn (Fenghuang Ancient Town) – Venice phương Đông
              - paragraph [ref=f5e225]: Thị trấn cổ hơn 1.300 năm tuổi thuộc châu tự trị người Thổ Gia, Miêu Tương Tây, nằm nép mình bên dòng Đà Giang. Đây là một trong những cổ trấn đẹp nhất Trung Quốc với những mái ngói đen rêu phong, cầu Hồng Kiều cổ kính và chợ đêm đèn lồng rực rỡ.
              - heading [level=3] [ref=f5e226]:
                - strong [ref=f5e227]: Mùa nào đẹp nhất cho tour Ân Thi – Trương Gia Giới – Phượng Hoàng?
              - paragraph [ref=f5e228]: "Hành trình trải dài qua ba điểm đến với khí hậu tương đối đồng nhất. Tham khảo mùa đẹp nhất cho từng thời điểm:"
              - paragraph [ref=f5e229]:
                - strong [ref=f5e230]: "Mùa xuân (tháng 3 – 5):"
              - paragraph [ref=f5e231]: Ân Thi và Trương Gia Giới bước vào mùa đẹp nhất, khí hậu ấm áp dễ chịu, cây cối đâm chồi nảy lộc, hoa rừng nở rộ. Nhiệt độ dao động 15-22°C, mưa phùn nhẹ tạo nên biển mây lãng mạn trên đỉnh núi.
              - paragraph [ref=f5e232]: Phượng Hoàng Cổ Trấn cũng trở nên thơ mộng với mưa xuân và những con phố đá ẩm ướt.
              - paragraph [ref=f5e233]:
                - strong [ref=f5e234]: "Mùa thu (tháng 9 – 11):"
              - paragraph [ref=f5e235]: Đây là thời điểm đẹp nhất trong năm tại cả ba điểm đến. Nhiệt độ 18-25°C, trời trong xanh, rất thuận lợi cho việc ngắm cảnh và chụp ảnh.
              - paragraph [ref=f5e236]: Trương Gia Giới bước vào mùa lá vàng đỏ đẹp nhất. Lượng khách thường đông vào tuần lễ vàng (1-7/10), vì vậy nên tránh dịp này.
              - paragraph [ref=f5e237]:
                - strong [ref=f5e238]: "Mùa hè (tháng 6 – 8):"
              - paragraph [ref=f5e239]: Nhiệt độ 26-32°C, mưa nhiều. Tuy nhiên, đây là mùa cao điểm du lịch do học sinh, sinh viên nghỉ hè.
              - paragraph [ref=f5e240]: Ân Thi nhờ nằm trong thung lũng nên có khí hậu mát mẻ quanh năm, dễ chịu hơn nhiều so với các thành phố khác của Trung Quốc.
              - paragraph [ref=f5e241]:
                - strong [ref=f5e242]: "Mùa đông (tháng 12 – 2):"
              - paragraph [ref=f5e243]: Nhiệt độ xuống dưới 10°C, vùng núi Trương Gia Giới có tuyết rơi tạo nên khung cảnh "ngàn năm băng giá". Đường trơn nên cần chú ý an toàn.
              - paragraph [ref=f5e244]: "Khuyến nghị của Haidangtravel: Tháng 4-5 và tháng 9-10 (tránh tuần lễ vàng) là thời điểm lý tưởng nhất. Nếu bạn thích cảnh tuyết trắng, hãy chọn tháng 1-2 và chuẩn bị quần áo ấm thật tốt."
              - heading [level=3] [ref=f5e245]:
                - strong [ref=f5e246]: Những trải nghiệm không thể bỏ lỡ trong tour
              - list [ref=f5e247]:
                - listitem [ref=f5e248]: Chiêm ngưỡng Đại Hiệp Cốc Ân Thi – hẻm núi karst hùng vĩ bậc nhất Trung Quốc, được ví như "Thụy Sĩ phương Đông".
                - listitem [ref=f5e249]: Khám phá văn hóa mẫu hệ tại Nữ Nhi Thành – tìm hiểu lối sống độc đáo của người Thổ Gia.
                - listitem [ref=f5e250]: Tham quan Thổ Ty Thành – chiêm ngưỡng Điện Cửu Cẩm với 333 cột trụ và hàng ngàn chi tiết chạm khắc tinh xảo, được dựng hoàn toàn bằng kỹ thuật mộng gỗ không đinh sắt.
                - listitem [ref=f5e251]: Chinh phục cáp treo dài nhất thế giới Thiên Môn Sơn – 30 phút lơ lửng giữa trời.
                - listitem [ref=f5e252]: Bước trên cầu kính trong suốt – trải nghiệm đi bộ trên không ở độ cao 300m.
                - listitem [ref=f5e253]: Dạo phố cổ Phượng Hoàng về đêm – thả đèn hoa đăng trên sông Đà.
                - listitem [ref=f5e254]: Đi thuyền gỗ ngắm cổ trấn – cảm nhận "Venice phương Đông" từ dòng nước.
                - listitem [ref=f5e255]: Ăn gì? – Ẩm thực Thổ Gia, Hồ Nam và đặc sản Phượng Hoàng
              - heading [level=3] [ref=f5e256]:
                - strong [ref=f5e257]: "Gợi Ý Ẩm thực Ân Thi (Thổ Gia):"
              - list [ref=f5e258]:
                - listitem [ref=f5e259]: "Lẩu Thổ Gia: Nồi gang với nước dùng được ninh từ xương và các loại thảo mộc núi rừng."
                - listitem [ref=f5e260]: "Thịt hun khói (Lạp Nhục): Thịt ba chỉ được hun bằng củi và vỏ cam, mang hương vị núi rừng đặc trưng."
                - listitem [ref=f5e261]: "Bánh gạo Thổ Gia (Ci Ba): Bánh làm từ gạo nếp, nướng trên than hồng."
                - listitem [ref=f5e262]: "Ẩm thực Trương Gia Giới (Hồ Nam):"
                - listitem [ref=f5e263]: "Lẩu Tam Cấp: Nồi gang 3 ngăn (cay, chua, thanh đạm) – món không thể bỏ lỡ."
