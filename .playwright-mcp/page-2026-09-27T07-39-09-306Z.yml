                  - text: – thịt heo luộc hoặc nướng ăn kèm rau rừng, chấm với nước chấm đặc biệt của nhà hàng.
                - paragraph [ref=f25e238]:
                  - img "meo heo lang tour mang dang nga 3 dong duong" [ref=f25e239]
                - paragraph [ref=f25e240]: Sau bữa ăn, bạn về khách sạn nhận phòng và nghỉ ngơi.
                - paragraph [ref=f25e241]:
