                - listitem [ref=f25e121]: Thưởng thức đặc sản địa phương nổi tiếng như lẩu cá tầm, gỏi lá Kon Tum, mẹt heo làng.
                - listitem [ref=f25e122]: Flow tour nhẹ nhàng, thiên về trải nghiệm và cảm xúc thay vì chạy điểm.
