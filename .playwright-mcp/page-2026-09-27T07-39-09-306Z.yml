            - group [ref=f25e183]:
              - 'generic "Ngày 1: PLEIKU – KON TUM – MĂNG ĐEN (ăn trưa, tối)" [ref=f25e184] [cursor=pointer]'
              - generic [ref=f25e190]:
                - paragraph [ref=f25e191]:
                  - strong [ref=f25e192]: "Buổi sáng: Khởi hành từ Sài Gòn"
                - paragraph [ref=f25e193]: Ngay khi bạn có mặt tại sân bay Tân Sơn Nhất, nhân viên Hải Đăng Travel sẽ hỗ trợ làm thủ tục cho chuyến bay thẳng đến Pleiku.
                - paragraph [ref=f25e194]:
                  - text: Sau khi hạ cánh xuống sân bay Pleiku, xe du lịch và hướng dẫn viên đã sẵn sàng đón bạn. Điểm dừng chân đầu tiên lúc 9h30 là
                  - strong [ref=f25e195]: Nhà Thờ Gỗ Kom Tum
                  - text: "– ngôi nhà thờ hơn 100 năm tuổi, được xây dựng hoàn toàn bằng gỗ cà chít với kỹ thuật ghép mộc độc đáo. Nhiều du khách thường hỏi: \"Tại sao nhà thờ này nổi tiếng đến vậy?\" Bởi đây không chỉ là biểu tượng của vùng đất Tây Nguyên mà còn là niềm tự hào của người dân Kon Tum, một điểm đến không thể bỏ lỡ khi đến đây."
                - paragraph [ref=f25e196]:
                  - strong [ref=f25e197]: "Buổi trưa: Đến Măng Đen - \"Đà Lạt thứ hai\""
                - paragraph [ref=f25e198]:
                  - text: Khoảng 11h30, đoàn đặt chân đến
                  - strong [ref=f25e199]: Măng Đen
                  - text: ". Bạn sẽ cảm nhận ngay không khí mát mẻ, se lạnh quanh năm – điều mà nhiều người ví von như Đà Lạt thứ hai của Việt Nam. Tại sao Măng Đen ngày càng hút khách? Vì vẻ đẹp còn giữ được nét hoang sơ: rừng thông bạt ngàn, 7 hồ nước trong xanh và 3 thác nước hùng vĩ, cùng văn hóa bản địa của đồng bào dân tộc vẫn còn lưu giữ nguyên vẹn."
                - paragraph [ref=f25e200]:
                  - text: Bữa trưa ngay tại Măng Đen là món
                  - strong [ref=f25e201]: Lẩu Cá Tầm
                  - text: – đặc sản "must-try" ở đây. Cá tầm được nuôi trong nguồn nước lạnh từ núi cao nên thịt rất chắc và ngọt.
                - paragraph [ref=f25e202]: Sau bữa ăn, bạn nhận phòng khách sạn (biệt thự nghỉ dưỡng) để nghỉ ngơi.
                - paragraph [ref=f25e203]:
                  - strong [ref=f25e204]: "Buổi chiều: Khám phá thiên nhiên và văn hóa"
                - paragraph [ref=f25e205]:
                  - text: Đúng 14h00, xe khởi hành đưa đoàn đến
                  - strong [ref=f25e206]: Khu du lịch thác Pa Sĩ
                  - text: . Điểm nhấn ở đây là cây cầu treo dây văng lệch nhịp – loại cầu duy nhất tại khu vực Miền Trung và Tây Nguyên, tạo nên góc check-in cực "ảo" giữa núi rừng.
                - paragraph [ref=f25e207]:
                  - text: Tiếp theo, bạn ghé thăm
                  - strong [ref=f25e208]: Vườn nghệ thuật Măng Đen
                  - text: nằm dưới những tán rừng thông xanh mướt. Hàng trăm bức tượng gỗ được chạm khắc thủ công mô phỏng đời sống và văn hóa của đồng bào dân tộc thiểu số Tây Nguyên. Đây là điểm đến lý tưởng cho những ai yêu thích nghệ thuật và muốn tìm hiểu đời sống bản địa.
                - paragraph [ref=f25e209]:
                  - text: Lúc 15h30, đoàn tham quan
                  - strong [ref=f25e210]: chùa Khánh Lâm
                  - text: – ngôi chùa tọa lạc giữa rừng già, rất thanh tịnh và yên bình, sau đó là
                  - strong [ref=f25e211]: Tượng Đức Mẹ Măng Đen
                  - text: với không gian thoáng đãng và view núi rừng hùng vĩ.
                - paragraph [ref=f25e212]:
                  - strong [ref=f25e213]: "Buổi tối: Ẩm thực núi rừng"
                - paragraph [ref=f25e214]: Khoảng 18h00, bạn dùng bữa tối tại nhà hàng địa phương với thực đơn đặc sản vùng cao như gà nướng, cơm lam, rau rừng...
                - paragraph [ref=f25e215]: Sau bữa tối, bạn tự do nghỉ ngơi, tận hưởng không khí se lạnh của Măng Đen. Nghỉ đêm tại Măng Đen.
            - group [ref=f25e216]:
