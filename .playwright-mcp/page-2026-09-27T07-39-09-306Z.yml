                  - strong [ref=f25e244]: Cửa Khẩu Quốc Tế Bờ Y
                  - text: ". Nhiều du khách thường hỏi: \"Ngã Ba Đông Dương có thực sự đáng đi không?\" Câu trả lời là"
                  - strong [ref=f25e245]: có
                  - text: . Đây là nơi duy nhất tại Việt Nam bạn có thể đứng trên cột mốc, một chân ở Việt Nam, hướng mắt sang Lào và Campuchia.
                - paragraph [ref=f25e246]: Cột mốc Ngã Ba Đông Dương làm bằng đá hoa cương, đặt trên đỉnh núi cao 1.086m so với mặt biển, cao 2m và nặng gần 900kg. Cột mốc hình trụ tam giác, mỗi mặt quay về hướng quốc gia đó, khắc tên nước và quốc huy trang trọng. Chạm tay vào cột mốc, bạn sẽ cảm nhận được niềm tự hào dân tộc khi đặt chân lên vùng đất "một con gà gáy cả ba nước đều nghe thấy".
                - paragraph [ref=f25e247]:
                  - strong [ref=f25e248]: "Buổi tối: Ẩm thực Kon Tum"
                - paragraph [ref=f25e249]:
                  - text: 18h00, về lại thành phố Kon Tum, đoàn dùng bữa tối với món
                  - strong [ref=f25e250]: Gỏi Lá Kon Tum
                  - text: – một trong 10 món ăn nổi tiếng nhất châu Á do Taste Atlas bình chọn. Gỏi lá có gì đặc biệt? Thay vì một loại rau duy nhất, món này có đến 20-30 loại lá rừng khác nhau, ăn kèm thịt ba chỉ, tôm khô, thính gạo và nước chấm chua cay mặn ngọt.
                - paragraph [ref=f25e251]:
                  - img "goi la kontum" [ref=f25e252]
                - paragraph [ref=f25e253]: Tối đến, bạn tự do khám phá Kon Tum về đêm. Nhiều người chọn dạo bộ dọc bờ sông Đăk Bla hoặc ngồi cà phê ven sông, thưởng thức ly cà phê Tây Nguyên đậm đà.
            - group [ref=f25e254]:
              - 'generic "NGÀY 3: KON TUM – PLEIKU – TP.HCM" [ref=f25e255] [cursor=pointer]'
              - generic [ref=f25e261]:
                - paragraph [ref=f25e262]:
                  - strong [ref=f25e263]: "Buổi sáng: Tạm biệt Kon Tum, khám phá Pleiku"
                - paragraph [ref=f25e264]:
                  - text: 6h30, sau bữa điểm tâm, đoàn khởi hành từ Kon Tum về Pleiku – Gia Lai. Khoảng 8h30, bạn đặt chân đến
                  - strong [ref=f25e265]: Rừng Thông Trăm Tuổi
                  - text: – được mệnh danh là "con đường Hàn Quốc" của Pleiku. Hàng thông cổ thụ cao vút, xếp dài tít tắp bên cạnh những rừng chè xanh bạt ngàn. Đây là điểm check-in yêu thích của giới trẻ và là nơi nhiều cặp đôi ghi dấu kỷ niệm.
                - paragraph [ref=f25e266]:
                  - text: Tiếp theo, đoàn đến
                  - strong [ref=f25e267]: Biển Hồ Pleiku
                  - text: – hồ nước ngọt tự nhiên lớn nhất Tây Nguyên, được ví như "mắt của núi rừng". Biển Hồ nổi tiếng đến mức nhạc sĩ Nguyễn Cường đã đưa vào ca khúc bất hủ "Đôi mắt Pleiku, Biển Hồ đầy". Cảnh đẹp ở đây là sự yên bình, mặt nước trong xanh phản chiếu mây trời.
                - paragraph [ref=f25e268]:
                  - strong [ref=f25e269]: "Buổi trưa: Cơm niêu Gia Lai"
                - paragraph [ref=f25e270]:
                  - text: 12h00, đoàn dùng
                  - strong [ref=f25e271]: cơm niêu
                  - text: tại nhà hàng địa phương. Cơm được nấu trong niêu đất, hạt cơm dẻo thơm, ăn kèm với các món mặn như gà xào sả ớt, cá bống sông suối chiên giòn, canh chua lá giang...
                - paragraph [ref=f25e272]:
                  - strong [ref=f25e273]: "Buổi chiều: Chùa Minh Thành và mua sắm đặc sản"
                - paragraph [ref=f25e274]:
                  - text: Sau bữa trưa, đoàn tham quan
                  - strong [ref=f25e275]: Chùa Minh Thành
                  - text: – ngôi chùa có kiến trúc vô cùng độc đáo, chịu ảnh hưởng từ phong cách Nhật Bản, Trung Quốc và Đài Loan. Không chỉ là nơi Phật tử đến chiêm bái, chùa Minh Thành còn thu hút du khách bởi cảnh quan đẹp, thanh tịnh và không khí mát mẻ quanh năm.
                - paragraph [ref=f25e276]: "15h00, xe đưa đoàn ra trung tâm thương mại mua đặc sản Tây Nguyên về làm quà. Gợi ý: cà phê Buôn Ma Thuột, mật ong rừng, rượu cần, thịt bò khô Gia Lai, hay trái cây như bơ, sầu riêng, chôm chôm."
                - paragraph [ref=f25e277]:
                  - strong [ref=f25e278]: "Buổi tối: Hành trình khép lại"
                - paragraph [ref=f25e279]: 16h00, xe và hướng dẫn viên đưa đoàn ra sân bay Pleiku, làm thủ tục đáp chuyến bay về lại Sài Gòn. Chuyến bay chiều giúp bạn về đến nhà trong buổi tối cùng ngày. Kết thúc hành trình Tây Nguyên 3 ngày 2 đêm đầy ắp kỷ niệm.
                - paragraph [ref=f25e280]: "Nhiều du khách sau tour thường nói: \"Đi Tây Nguyên một lần là nhớ mãi, không chỉ vì cảnh đẹp mà còn vì sự chân chất, mộc mạc của con người nơi đây.\""
