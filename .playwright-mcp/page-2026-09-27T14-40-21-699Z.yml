                  - textbox "<section>...</section>" [ref=f1e1063]: "<!-- PHẦN: CÁC DỊCH VỤ KHÁC --> <section class=\"bg-[color:var(--color-bg-soft)] px-4 py-8 sm:px-6 lg:px-8 lg:py-10\"> <div class=\"mx-auto max-w-7xl\"> <div class=\"mx-auto max-w-3xl text-center\"> <h2 class=\"frontsite-h2 mx-auto text-center\">DỊCH VỤ KHÁC</h2> <p class=\"mt-3 text-sm leading-7 text-slate-600\">Giải pháp toàn diện đáp ứng mọi nhu cầu di chuyển và lưu trú của quý khách</p> </div> <div class=\"mt-10 grid gap-6 md:grid-cols-2 lg:grid-cols-4\"> <!-- Dịch vụ Cho thuê xe --> <a href=\"https://haidangtravel.com/thue-xe-du-lich\" class=\"group overflow-hidden rounded-[1.75rem] border border-orange-100 bg-[linear-gradient(180deg,_#fff8f2_0%,_#ffffff_100%)] shadow-[0_24px_70px_-50px_rgba(255,106,0,0.25)] hover:shadow-lg transition\"> <div class=\"p-6\"> <div class=\"inline-flex size-14 items-center justify-center rounded-full bg-white text-lg font-black text-primary shadow-sm group-hover:bg-primary group-hover:text-white transition\"> <i class=\"fa-solid fa-car text-xl\"></i> </div> <h3 class=\"mt-5 font-heading text-xl font-bold text-slate-950 group-hover:text-primary transition\">Cho thuê xe</h3> <p class=\"mt-4 text-sm leading-7 text-slate-600\">Đa dạng xe từ 4 chỗ đến 45 chỗ, xe giường nằm, xe Limousine. Tài xế chuyên nghiệp, giá tốt nhất.</p> <div class=\"mt-4 inline-flex items-center gap-1 text-primary text-sm font-semibold group-hover:gap-2 transition\">Xem chi tiết <i class=\"fa-solid fa-arrow-right\"></i></div> </div> </a> <!-- Dịch vụ Vé máy bay --> <a href=\"https://haidangtravel.com/ve-may-bay-gia-re\" class=\"group overflow-hidden rounded-[1.75rem] border border-orange-100 bg-[linear-gradient(180deg,_#fff8f2_0%,_#ffffff_100%)] shadow-[0_24px_70px_-50px_rgba(255,106,0,0.25)] hover:shadow-lg transition\"> <div class=\"p-6\"> <div class=\"inline-flex size-14 items-center justify-center rounded-full bg-white text-lg font-black text-primary shadow-sm group-hover:bg-primary group-hover:text-white transition\"> <i class=\"fa-solid fa-plane-departure text-xl\"></i> </div> <h3 class=\"mt-5 font-heading text-xl font-bold text-slate-950 group-hover:text-primary transition\">Vé máy bay</h3> <p class=\"mt-4 text-sm leading-7 text-slate-600\">Đại lý chính thức của các hãng bay nội địa và quốc tế. Giá tốt, hỗ trợ đổi/hoàn vé linh hoạt.</p> <div class=\"mt-4 inline-flex items-center gap-1 text-primary text-sm font-semibold group-hover:gap-2 transition\">Xem chi tiết <i class=\"fa-solid fa-arrow-right\"></i></div> </div> </a> <!-- Dịch vụ Visa --> <a href=\"https://haidangtravel.com/visa-passport\" class=\"group overflow-hidden rounded-[1.75rem] border border-orange-100 bg-[linear-gradient(180deg,_#fff8f2_0%,_#ffffff_100%)] shadow-[0_24px_70px_-50px_rgba(255,106,0,0.25)] hover:shadow-lg transition\"> <div class=\"p-6\"> <div class=\"inline-flex size-14 items-center justify-center rounded-full bg-white text-lg font-black text-primary shadow-sm group-hover:bg-primary group-hover:text-white transition\"> <i class=\"fa-solid fa-passport text-4xl\"></i> </div> <h3 class=\"mt-5 font-heading text-xl font-bold text-slate-950 group-hover:text-primary transition\">Dịch vụ Visa</h3> <p class=\"mt-4 text-sm leading-7 text-slate-600\">Hỗ trợ xin visa các nước Châu Á, Châu Âu, Châu Mỹ, Châu Úc. Tỷ lệ đậu cao, thủ tục nhanh.</p> <div class=\"mt-4 inline-flex items-center gap-1 text-primary text-sm font-semibold group-hover:gap-2 transition\">Xem chi tiết <i class=\"fa-solid fa-arrow-right\"></i></div> </div> </a> <!-- Dịch vụ Du học --> <a href=\"https://haidangtravel.com/tu-van-du-hoc\" class=\"group overflow-hidden rounded-[1.75rem] border border-orange-100 bg-[linear-gradient(180deg,_#fff8f2_0%,_#ffffff_100%)] shadow-[0_24px_70px_-50px_rgba(255,106,0,0.25)] hover:shadow-lg transition\"> <div class=\"p-6\"> <div class=\"inline-flex size-14 items-center justify-center rounded-full bg-white text-lg font-black text-primary shadow-sm group-hover:bg-primary group-hover:text-white transition\"> <i class=\"fa-solid fa-graduation-cap text-4xl\"></i> </div> <h3 class=\"mt-5 font-heading text-xl font-bold text-slate-950 group-hover:text-primary transition\">Tư vấn du học</h3> <p class=\"mt-4 text-sm leading-7 text-slate-600\">Định hướng lộ trình, chọn trường, hoàn thiện hồ sơ du học các nước. Hỗ trợ săn học bổng.</p> <div class=\"mt-4 inline-flex items-center gap-1 text-primary text-sm font-semibold group-hover:gap-2 transition\">Xem chi tiết <i class=\"fa-solid fa-arrow-right\"></i></div> </div> </a> </div> </div> </section>"
