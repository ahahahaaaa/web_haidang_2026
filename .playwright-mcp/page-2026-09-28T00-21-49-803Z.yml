                  - textbox "<section>...</section>" [ref=f5e214]: "<style> /* Reset component – không nền, không bóng, không dots */ .hdtb-banner-slider { max-width: 1280px; margin: 50px auto; /* Tạo khoảng trống trên và dưới 50px */ position: relative; font-family: system-ui, 'Segoe UI', sans-serif; } .hdtb-slider-container { position: relative; overflow: hidden; background: transparent; /* không nền */ box-shadow: none; /* không bóng */ } .hdtb-slider-track { display: flex; transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.4, 1.1); } /* Slide mặc định (desktop) */ .hdtb-slide { flex: 0 0 100%; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; padding: 0; box-sizing: border-box; } .hdtb-slide-item { position: relative; border-radius: 20px; overflow: hidden; aspect-ratio: 16 / 9; background: transparent; /* không nền */ box-shadow: none; /* không bóng đổ */ transition: transform 0.3s; } .hdtb-slide-item:hover { transform: scale(1.02); } .hdtb-slide-item img { width: 100%; height: 100%; object-fit: cover; display: block; } /* Nút điều hướng */ .hdtb-slider-btn { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(0,0,0,0.5); color: white; border: none; width: 44px; height: 44px; border-radius: 50%; font-size: 1.5rem; cursor: pointer; z-index: 10; transition: 0.2s; display: flex; align-items: center; justify-content: center; backdrop-filter: blur(4px); } .hdtb-slider-btn:hover { background: #e11d48; } .hdtb-prev { left: 15px; } .hdtb-next { right: 15px; } /* ===== MOBILE: mỗi slide chỉ 1 hình ===== */ @media (max-width: 767px) { .hdtb-slide { grid-template-columns: 1fr; /* 1 cột */ gap: 0; padding: 0; } .hdtb-slide-item { border-radius: 16px; } .hdtb-slider-btn { width: 36px; height: 36px; font-size: 1.2rem; } } </style> </head> <body> <div class=\"hdtb-banner-slider\"> <div class=\"hdtb-slider-container\"> <div class=\"hdtb-slider-track\" id=\"hdtbSliderTrack\"></div> <button class=\"hdtb-slider-btn hdtb-prev\" id=\"hdtbPrevBtn\">&#10094;</button> <button class=\"hdtb-slider-btn hdtb-next\" id=\"hdtbNextBtn\">&#10095;</button> </div> <!-- Không có dots --> </div> <script> (function() { // ======================== // DANH SÁCH ẢNH (bạn tự thay link và alt) // ======================== const images = [ { src: \"https://haidangtravel.com/storage/1466/tour-du-lich-singapore.webp\", alt: \"tour-du-lich-singapore\" }, { src: \"https://haidangtravel.com/storage/1465/du-lich-an-do-nepal-hanh-huong.webp\", alt: \"du-lich-an-do-nepal-hanh-huong\" }, { src: \"https://haidangtravel.com/storage/1464/tour-du-lich-ta-dung.webp\", alt: \"tour-du-lich-ta-dung\" }, { src: \"https://haidangtravel.com/storage/1467/tour-binh-hung-ninh-chu%CC%9B.webp\", alt: \"Resort 5 sao cho doanh nghiệp\" }, ]; let currentIndex = 0; let slidesData = []; let autoInterval; const intervalTime = 5000; // 5 giây const track = document.getElementById('hdtbSliderTrack'); const prevBtn = document.getElementById('hdtbPrevBtn'); const nextBtn = document.getElementById('hdtbNextBtn'); // Hàm tạo slides theo từng thiết bị function buildSlides() { const isMobile = window.innerWidth <= 767; const newSlides = []; if (isMobile) { // Mobile: mỗi ảnh là 1 slide images.forEach(img => { newSlides.push([img]); }); } else { // Desktop: ghép cặp 2 ảnh for (let i = 0; i < images.length; i += 2) { const pair = [images[i]]; if (i + 1 < images.length) pair.push(images[i+1]); newSlides.push(pair); } } return newSlides; } // Render slider (không tạo dots) function renderSlider() { slidesData = buildSlides(); track.innerHTML = ''; slidesData.forEach(slideImages => { const slideDiv = document.createElement('div'); slideDiv.className = 'hdtb-slide'; slideImages.forEach(img => { const itemDiv = document.createElement('div'); itemDiv.className = 'hdtb-slide-item'; const imgEl = document.createElement('img'); imgEl.src = img.src; imgEl.alt = img.alt; imgEl.loading = 'lazy'; itemDiv.appendChild(imgEl); slideDiv.appendChild(itemDiv); }); track.appendChild(slideDiv); }); if (currentIndex >= slidesData.length) currentIndex = 0; goToSlide(currentIndex); } function goToSlide(index) { if (!slidesData.length) return; if (index < 0) index = slidesData.length - 1; if (index >= slidesData.length) index = 0; currentIndex = index; track.style.transform = `translateX(-${currentIndex * 100}%)`; resetAutoPlay(); } function nextSlide() { goToSlide(currentIndex + 1); } function prevSlide() { goToSlide(currentIndex - 1); } function startAutoPlay() { if (autoInterval) clearInterval(autoInterval); autoInterval = setInterval(nextSlide, intervalTime); } function resetAutoPlay() { if (autoInterval) clearInterval(autoInterval); startAutoPlay(); } // Xử lý resize màn hình let resizeTimeout; window.addEventListener('resize', () => { clearTimeout(resizeTimeout); resizeTimeout = setTimeout(() => { const oldIndex = currentIndex; renderSlider(); currentIndex = Math.min(oldIndex, slidesData.length - 1); if (currentIndex < 0) currentIndex = 0; goToSlide(currentIndex); }, 150); }); renderSlider(); startAutoPlay(); // Dừng auto khi hover const container = document.querySelector('.hdtb-slider-container'); container.addEventListener('mouseenter', () => clearInterval(autoInterval)); container.addEventListener('mouseleave', startAutoPlay); prevBtn.addEventListener('click', prevSlide); nextBtn.addEventListener('click', nextSlide); })(); </script>"
